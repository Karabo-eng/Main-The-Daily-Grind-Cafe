<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Daily Grind Cafe | Enquiry</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <nav>

            <h1 class="logo">
                The Daily Grind Cafe
            </h1>

            <ul class="navigation">

                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="ordering.html">Order Online</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>

            </ul>

        </nav>

    </header>


    <section class="page-heading">

        <h2>Make an Enquiry</h2>

        <p>
            Have a question? Contact our team.
        </p>

    </section>


    <section class="form-section">

        <form>

            <h2>Enquiry Form</h2>


            <label for="name">
                Full Name:
            </label>

            <input
                type="text"
                id="name"
                required
            >


            <label for="email">
                Email Address:
            </label>

            <input
                type="email"
                id="email"
                required
            >


            <label for="phone">
                Phone Number:
            </label>

            <input
                type="tel"
                id="phone"
            >


            <label for="subject">
                Enquiry Type:
            </label>

            <select id="subject">

                <option>
                    Restaurant Reservation
                </option>

                <option>
                    Private Event
                </option>

                <option>
                    Catering
                </option>

                <option>
                    Menu Information
                </option>

                <option>
                    Other
                </option>

            </select>


            <label for="message">
                Message:
            </label>

            <textarea
                id="message"
                rows="6"
                required
            ></textarea>


            <button
                type="submit"
                class="button"
            >
                Submit Enquiry
            </button>

        </form>

    </section>


    <footer>

        <p>
            &copy; 2026 The Daily Grind Cafe. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
